<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1a18"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4e9"/>
      <stop offset="50%" stop-color="#eedbc5"/>
      <stop offset="100%" stop-color="#c9ad90"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Luxury Dark Canvas -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#eedbc5" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Serif Monogram 'A' -->
  <text 
    x="27" 
    y="46" 
    font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
    font-size="39" 
    font-weight="500" 
    fill="url(#goldText)" 
    text-anchor="middle"
    filter="url(#shadow)"
  >A</text>

  <!-- Signature Adwika Red Bindi Dot -->
  <circle cx="43" cy="22" r="4.2" fill="#e52b31" filter="url(#shadow)"/>
  <circle cx="41.8" cy="20.8" r="1.2" fill="#ff7070" opacity="0.8"/>
</svg>